<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1e23">
<title>Solarian Arcade</title>
<link rel="stylesheet" href="shared/fonts.css">
<link rel="stylesheet" href="shared/arcade.css">
<link rel="stylesheet" href="shared/picker.css">
</head>
<body class="picker">
<header class="top">
  <div class="welcome">
    <div class="welcome-in">
      <svg class="sun" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="9" fill="none" stroke="currentColor" stroke-width="3.5"/>
        <g stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
          <path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M38.1 9.9l-4.2 4.2M14.1 33.9l-4.2 4.2"/>
        </g>
      </svg>
      <div>
        <h1>Solarian Arcade</h1>
        <p>4 exits, one wallet</p>
      </div>
    </div>
  </div>
  <div class="toll" title="Your coins work in every game">
    <span>COINS</span>
    <b id="wallet">0</b>
  </div>
</header>

<main class="gantry" aria-label="Pick a game">
  <div class="beam" aria-hidden="true"></div>

  <a class="exit green" href="road-rush/index.html">
    <div class="sign">
      <span class="tab">EXIT 1</span>
      <div class="face">
        <h2>Road Rush</h2>
        <p>Cross. Dodge. Survive.</p>
        <img src="shared/art/rr-island.webp" alt="" draggable="false">
        <svg class="arrow" viewBox="0 0 48 64" aria-hidden="true"><path d="M24 3 45 27H31v34H17V27H3z" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="plate"><span>BEST</span> <b id="stat-rr">0</b></div>
  </a>

  <a class="exit blue" href="traffic-control/index.html">
    <div class="sign">
      <span class="tab">EXIT 2</span>
      <div class="face">
        <h2>Traffic Control</h2>
        <p>Keep it moving. Keep it from going boom.</p>
        <img src="shared/art/tc-island.webp" alt="" draggable="false">
        <svg class="arrow" viewBox="0 0 48 64" aria-hidden="true"><path d="M24 3 45 27H31v34H17V27H3z" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="plate"><span>STARS</span> <b id="stat-tc">0</b></div>
  </a>

  <a class="exit orange" href="boom-run/index.html">
    <div class="sign">
      <span class="tab">EXIT 3</span>
      <div class="face">
        <h2>Boom Run</h2>
        <p>Floor it. Weave. Don't blink.</p>
        <img src="shared/art/br-island.webp" alt="" draggable="false">
        <svg class="arrow" viewBox="0 0 48 64" aria-hidden="true"><path d="M24 3 45 27H31v34H17V27H3z" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="plate"><span>BEST</span> <b id="stat-br">0</b></div>
  </a>

  <a class="exit purple" href="hall-of-art/index.html">
    <div class="sign">
      <span class="tab">EXIT 4</span>
      <div class="face">
        <h2>Hall of Art</h2>
        <p>Moving pictures and living buttons.</p>
        <img src="shared/art/ha-island.webp" alt="" draggable="false">
        <svg class="arrow" viewBox="0 0 48 64" aria-hidden="true"><path d="M24 3 45 27H31v34H17V27H3z" fill="currentColor"/></svg>
      </div>
    </div>
    <div class="plate"><span>EXPLORED</span> <b id="stat-ha">0</b></div>
  </a>
</main>

<div class="road" aria-hidden="true"></div>

<script src="shared/wallet.js"></script>
<script src="shared/picker.js"></script>
</body>
</html>
